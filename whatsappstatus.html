<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div:first-of-type{
            border: 1px solid blue;
            height :400px;
            width: 550px;
        }
        div{
            display: flex;
        }
        div p{
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }
        #one{
            background-color:red
        }
        #two{
            background-color:blue;
        }
        #three{
            background-color:purple
        }
        #four{
            background-color:yellow;
        }
        #five{
            background-color:green;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div>
        <p id="one">Red</p>
        <p id="two">Blue</p>
        <p id="three">purple</p>
        <p id="four">yellow</p>
        <p id="five">green</p>
    </div>
    <script src="whatsapp.js"></script>
</body>
</html>
